<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Te amo Sol ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:"Segoe UI",system-ui,sans-serif;
  color:#fff;
  display:grid;
  place-items:center;
  text-align:center;
  background:
    radial-gradient(circle at 50% 45%,rgba(255,50,135,.22),transparent 30%),
    linear-gradient(135deg,#0d000c,#390019 50%,#10000e);
}
.content{position:relative;z-index:10;width:min(90%,850px);padding:25px}
.heart-main{
  font-size:clamp(65px,12vw,125px);
  animation:heartbeat 1.5s ease-in-out infinite;
  filter:drop-shadow(0 0 22px rgba(255,35,115,.85));
}
h1{font-size:clamp(42px,9vw,92px);margin:15px 0}
.message{font-size:clamp(18px,3vw,27px);line-height:1.6;margin-top:25px}
.date{
  margin-top:28px;
  font-size:clamp(16px,2.8vw,24px);
  letter-spacing:5px;
  opacity:0;
  animation:blink 1.8s ease-in-out infinite;
}

/* Corazones */
.heart{
  position:fixed;
  top:-50px;
  pointer-events:none;
  animation:fall var(--d) linear forwards;
}
@keyframes fall{
  from{transform:translateY(-60px);opacity:0}
  10%{opacity:.9}
  to{transform:translate(var(--x),110vh) rotate(220deg);opacity:0}
}
@keyframes heartbeat{
  0%,100%{transform:scale(1)}
  20%{transform:scale(1.1)}
  40%{transform:scale(1)}
}
@keyframes blink{
  0%,100%{opacity:0}
  50%{opacity:1}
}
</style>
</head>
<body>
<main class="content">
  <div class="heart-main">❤️</div>
  <h1 id="title"></h1>
  <div class="message" id="message"></div>
  <div class="date">17/08/2026</div>
</main>

<script>
const title="Te amo Sol";
const message="Siempre agradeceré el día que vos y yo nos conocimos, porque ese día encontré lo que tanto busqué";

function typeText(el,text,speed,callback){
  let i=0;
  const timer=setInterval(()=>{
    el.textContent+=text[i];
    i++;
    if(i>=text.length){
      clearInterval(timer);
      if(callback)callback();
    }
  },speed);
}

typeText(document.getElementById("title"),title,120,()=>{
  typeText(document.getElementById("message"),message,38);
});

/* corazones optimizados */
const symbols=["❤️","💗","💕","💖","💘"];
let active=0;
function spawn(){
  if(active>20)return;
  const h=document.createElement("div");
  h.className="heart";
  h.textContent=symbols[Math.floor(Math.random()*symbols.length)];
  const d=5+Math.random()*3;
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=15+Math.random()*20+"px";
  h.style.setProperty("--d",d+"s");
  h.style.setProperty("--x",(Math.random()*180-90)+"px");
  document.body.appendChild(h);
  active++;
  h.addEventListener("animationend",()=>{h.remove();active--;},{once:true});
}
setInterval(spawn,300);
for(let i=0;i<16;i++)setTimeout(spawn,i*140);
</script>
</body>
</html>
